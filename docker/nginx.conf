# Confess web app — static files with the same security headers as vercel.json.
# Runs as non-root (nginx-unprivileged) on port 8080. TLS is done by the reverse proxy in front.
#
# nginx rule to remember: a location that has ANY add_header loses the server-level ones,
# so every location includes the security headers itself.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 1k;          # nothing is ever uploaded to this server

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    # Liveness for Docker / the reverse proxy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles.
    location ~ /\. {
        return 404;
    }

    # Hashed build files and fonts: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker: always revalidate so updates arrive.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else is the app (/, /p/<id>, /write, /auth/google…).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
