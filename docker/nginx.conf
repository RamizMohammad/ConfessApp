# Confess web app — static files with the same security headers as vercel.json.
# Runs as non-root (nginx-unprivileged) on port 8012. TLS is done by the reverse proxy in front.
#
# nginx rule to remember: a location that has ANY add_header loses the server-level ones,
# so every location includes the security headers itself.

# ── Logs: one readable line per page load, same shape as the API's ────────────────
#   16:10:50 ──▶    web        GET    /p/5fb0cc12...                           200     1ms  49.36.181.206  iPhone · Safari
# nginx writes into /tmp/nginx-log.pipe; docker/start.sh runs docker/logfmt.awk on it → docker logs.
# Files (assets, fonts, icons, sw.js, manifest) are logged only when they fail; /healthz never.
map $http_user_agent $client_device {
    ~*(bot|crawl|spider|slurp|curl|wget|python|go-http)  bot;
    ~*iPhone      iPhone;
    ~*iPad        iPad;
    ~*Android     Android;
    ~*Macintosh   Mac;
    ~*Windows     Windows;
    ~*Linux       Linux;
    default       other;
}
map $http_user_agent $client_browser {
    ~*(bot|crawl|spider|slurp|curl|wget|python|go-http)  -;
    ~*Edg/            Edge;
    ~*(CriOS|Chrome/) Chrome;
    ~*(FxiOS|Firefox/) Firefox;
    ~*Safari/         Safari;
    default           -;
}
map $status $file_failed {
    ~^[23]   0;
    default  1;
}
# Tab-separated for docker/logfmt.awk, which prints the readable, coloured line.
log_format confess '$time_iso8601\t$status\t$request_method\t$request_uri\t$request_time\t'
                   '$body_bytes_sent\t$remote_addr\t$client_device · $client_browser';

server {
    listen 8012;
    listen [::]:8012;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /tmp/nginx-log.pipe confess;

    # The visitor's real IP: trust X-Real-IP only from the central nginx on the Docker network.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 1k;          # nothing is ever uploaded to this server

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    # Liveness for Docker / the reverse proxy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles.
    location ~ /\. {
        return 404;
    }

    # Hashed build files and fonts: cache forever.
    location /assets/ {
        access_log /tmp/nginx-log.pipe confess if=$file_failed;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /fonts/ {
        access_log /tmp/nginx-log.pipe confess if=$file_failed;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /icons/ {
        access_log /tmp/nginx-log.pipe confess if=$file_failed;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker: always revalidate so updates arrive.
    location = /sw.js {
        access_log /tmp/nginx-log.pipe confess if=$file_failed;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        access_log /tmp/nginx-log.pipe confess if=$file_failed;
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else is the app (/, /p/<id>, /write, /auth/google…).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
