# Main nginx config for the Confess web app (replaces the image's /etc/nginx/nginx.conf).
# Same essentials as nginx-unprivileged's own — pid and temp files in /tmp — plus: every log
# line goes through /tmp/nginx-log.pipe so start.sh can print it readably.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-log.pipe warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
